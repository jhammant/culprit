[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "culprit"
version = "0.1.0"
description = "Find what is making your Mac or Linux machine worse: who is starting processes, eating memory and filling the disk. No root, no dependencies, and it starts no processes itself."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jon Hammant" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["macos", "linux", "performance", "process", "monitoring", "load-average", "agents"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.scripts]
culprit = "culprit.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/culprit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
